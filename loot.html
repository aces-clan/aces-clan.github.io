<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preload" href="fonts/gt-pressura-vf.ttf" as="font" type="font/ttf" crossorigin><title>ACES · Распределение лута</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css?v=loot8"><link rel="stylesheet" href="vampir.css?v=event-defaults1">
<style>
.loot-panel {
  min-height: var(--site-height);
  grid-template-columns: minmax(0, 440px) minmax(0, 1fr);
  grid-template-areas: "title title" "controls controls" "participants draw";
  gap: 20px;
}
.loot-controls {
  padding: 12px 16px;
  border: 1px solid var(--rule);
  background: #0c131a;
}
.loot-controls #loot-items {
  display: flex;
  flex-wrap: wrap;
}
.loot-controls #loot-items .loot-queue-item {
  max-width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  border-bottom: 2px solid var(--rule);
  background: #11191f;
}
.loot-controls #loot-items .loot-queue-item:has(input:checked) {
  color: #ffebc3;
  background: linear-gradient(#21191e, #492627);
  border-bottom-color: #f1b07e;
}
.loot-controls #loot-items input { accent-color: var(--gold); }
.loot-participants {
  display: flex;
  flex-direction: column;
  align-self: stretch;
  min-height: 0;
  gap: 16px;
}
#loot-group .loot-segments label { position: relative; }
#loot-group .loot-segments input { inset-inline-start: 0; width: 1px; height: 1px; margin: 0; padding: 0; }
.loot-filters {
  border: 1px solid var(--rule);
}
.loot-filters summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: inherit;
  list-style: none;
  cursor: pointer;
  font-weight: 600;
}
.loot-filters summary:hover { background: #ffffff0a; }
.loot-filters summary:focus-visible { outline: 1px solid var(--gold); outline-offset: -2px; }
.loot-filters summary::-webkit-details-marker { display: none; }
.loot-filters summary::after {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  margin: 0 3px;
  border-right: 1px solid var(--gold);
  border-bottom: 1px solid var(--gold);
  transform: rotate(-45deg);
}
.loot-filters[open] summary::after { transform: rotate(45deg); }
.loot-participants .loot-exclusion {
  display: grid;
  gap: 8px;
  padding: 4px 12px 12px;
}
.loot-participants #loot-members {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
#loot-member-list { flex: 1; min-height: 0; overflow: auto; align-content: start; }
.loot-draw {
  position: static;
  align-self: stretch;
  grid-template-rows: minmax(0, 1fr);
}
.loot-draw .wheel-wrap { align-self: center; max-width: 500px; }
@media (min-width: 981px) and (min-height: 700px) {
  .loot-panel { height: var(--site-height); grid-template-rows: auto auto minmax(0, 1fr); }
  .loot-controls #loot-items { max-height: 6rem; overflow: auto; }
  .loot-draw .wheel-wrap { max-width: min(500px, calc(100dvh - 350px)); }
}
@media (max-width: 980px) {
  .loot-panel {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "title" "controls" "participants" "draw";
  }
  .loot-draw { min-height: var(--site-height); }
}
</style>
</head>

<h1>Распределение лута</h1>
<div class="loot-controls">
<p id="loot-queue-status" role="status"></p>
<fieldset id="loot-queue" hidden>
<legend>Нераспределённые предметы</legend>
<div id="loot-items"></div>
</fieldset>
</div>
<div class="loot-participants">
<fieldset id="loot-group" class="loot-groups" disabled>
<legend>Группа</legend>
<div class="loot-segments">
<label><input type="radio" name="loot-group" value="1" checked><span>Группа 1</span></label>
<label><input type="radio" name="loot-group" value="2"><span>Группа 2</span></label>
<label><input type="radio" name="loot-group" value="3"><span>Группа 3</span></label>
</div>
</fieldset>
<details class="loot-filters">
<summary>Правила исключения из розыгрыша</summary>
<fieldset class="loot-exclusion" aria-label="Правила исключения">
<label><input type="checkbox" id="exclude-last" checked> Последнего получателя</label>
<label><input type="checkbox" id="exclude-owners" checked> Тех, у кого уже есть предмет</label>
<label><input type="checkbox" id="require-gear" checked> Тех, кто не указал свои вещи</label>
<label><input type="checkbox" id="exclude-newcomers" checked> Тех, кто в клане менее 7 дней</label>
</fieldset>
</details>
<fieldset id="loot-members" disabled>
<legend id="candidates">Участники</legend>
<div id="loot-member-list"></div>
</fieldset>
<p id="last-recipient"></p>
</div>
<div class="loot-draw">
<div class="wheel-wrap"><div class="wheel-pointer" aria-hidden="true"></div><canvas id="loot-wheel" width="560" height="560" aria-label="Колесо распределения лута"></canvas></div>
<p id="page-status" role="status">Загрузка состава…</p>
<div class="loot-spin-actions">
<button class="site-button site-button-primary" id="spin" type="button" disabled>Крутить колесо</button>
<button class="site-button" id="record-loot" type="button" hidden>Подтвердить распределение</button>
</div>
</div>
</section></main></div><script src="loot-config.js"></script><script src="app.js?v=departure-day1"></script><script src="site-auth.js?v=gear-approval1"></script><script src="gear.js?v=14"></script><script src="loot.js?v=manual3"></script><script src="admin-ui.js?v=1"></script><script src="loot-intake.js?v=4"></script>
